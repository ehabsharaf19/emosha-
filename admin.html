<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم إيموشا - إدارة الأقسام الجديدة</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --gold-primary: #d4af37;
            --text-color: #ffffff;
        }
        body { 
            background-color: var(--bg-color); 
            color: var(--text-color); 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            margin: 0; 
            padding: 20px; 
            direction: rtl;
        }
        .dashboard-card { 
            max-width: 600px; 
            margin: 40px auto; 
            background: var(--card-bg); 
            border: 2px solid var(--gold-primary); 
            border-radius: 12px; 
            padding: 30px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); 
        }
        h1 { color: var(--gold-primary); text-align: center; margin-bottom: 25px; font-size: 24px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #ccc; font-size: 14px; }
        .form-control { 
            width: 100%; 
            padding: 12px; 
            background-color: #000; 
            border: 1px solid #444; 
            border-radius: 6px; 
            color: #fff; 
            font-size: 16px; 
            box-sizing: border-box; 
            outline: none; 
            margin-bottom: 20px; 
        }
        .form-control:focus { border-color: var(--gold-primary); }
        select.form-control { cursor: pointer; background: #000; color: #fff; }
        .submit-btn { 
            width: 100%; 
            padding: 14px; 
            background-color: var(--gold-primary); 
            color: #000; 
            border: none; 
            border-radius: 6px; 
            font-size: 16px; 
            font-weight: bold; 
            cursor: pointer; 
            transition: background 0.3s; 
        }
        .submit-btn:hover { background-color: #f3e5ab; }
    </style>
</head>
<body>

    <div id="adminWrapper" style="display:none;">
        <div class="dashboard-card">
            <h1>إضافة ونشر محتوى جديد للأكاديمية 🚀</h1>
            
            <label for="artCategory">اختر الصفحة التي تريد ظهور المقال فيها:</label>
            <select id="artCategory" class="form-control">
                <option value="الرئيسية">🏠 الصفحة الرئيسية</option>
                <option value="الربح من الإنترنت">💰 قسم الربح من الإنترنت</option>
                <option value="أسرار فيسبوك">🔥 قسم أسرار فيسبوك</option>
                <option value="تطوير المواقع">🌐 قسم بناء وتطوير المواقع</option>
                <option value="ثانوية عامة">📚 قسم بوابة الثانوية العامة (المكتبة)</option>
            </select>

            <label for="artTitle">عنوان المقال أو المنشور:</label>
            <input type="text" id="artTitle" class="form-control" placeholder="اكتب العنوان هنا...">

            <label for="artContent">محتوى المقال تفصيلياً:</label>
            <textarea id="artContent" class="form-control" rows="6" placeholder="اكتب نص المقال كاملاً هنا..."></textarea>

            <button id="btnPublish" class="submit-btn">نشر المقال فوراً 📢</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBORppTYoq6wbsoM8cED7T_cW5UHVX5XbE",
            authDomain: "emosha-b67a3.firebaseapp.com",
            databaseURL: "https://emosha-b67a3-default-rtdb.firebaseio.com",
            projectId: "emosha-b67a3",
            storageBucket: "emosha-b67a3.firebasestorage.app",
            messagingSenderId: "136317351287",
            appId: "1:136317351287:web:f9b7186384278ba6c21d72",
            measurementId: "G-G4F8CDJV0L"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        if(prompt("الباسورد الخاص بالإدارة:") === "123010111  55Ee") {
            document.getElementById('adminWrapper').style.display = 'block';
        } else {
            alert("الباسورد خطأ! لا يمكنك دخول لوحة التحكم.");
        }

        document.getElementById("btnPublish").addEventListener("click", () => {
            const titleInput = document.getElementById("artTitle");
            const contentInput = document.getElementById("artContent");
            const categorySelect = document.getElementById("artCategory");

            const title = titleInput.value.trim();
            const content = contentInput.value.trim();
            const category = categorySelect.value;

            if(title === "" || content === "") {
                alert("من فضلك املأ العنوان والمحتوى أولاً قبل النشر!");
                return;
            }

            db.collection("articles").add({
                title: title,
                content: content,
                category: category,
                date: new Date().toLocaleDateString('ar-EG', { year: 'numeric', month: 'long', day: 'numeric' })
            })
            .then(() => {
                alert("تم النشر بنجاح وتوجيهه إلى قسم [" + category + "] !");
                titleInput.value = "";
                contentInput.value = "";
            })
            .catch(err => {
                alert("حدث خطأ أثناء النشر: " + err.message);
            });
        });
    </script>
</body>
</html>
