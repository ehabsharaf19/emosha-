<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم إيموشا - إدارة الأقسام</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --gold-primary: #d4af37;
            --text-color: #ffffff;
        }
        body { 
            background-color: var(--bg-color); 
            color: var(--text-color); 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            margin: 0; 
            padding: 20px; 
            direction: rtl;
        }
        .dashboard-card { 
            max-width: 600px; 
            margin: 40px auto; 
            background: var(--card-bg); 
            border: 2px solid var(--gold-primary); 
            border-radius: 12px; 
            padding: 30px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); 
        }
        h1 { color: var(--gold-primary); text-align: center; margin-bottom: 25px; font-size: 24px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #ccc; font-size: 14px; }
        .form-control { 
            width: 100%; 
            padding: 12px; 
            background-color: #000; 
            border: 1px solid #444; 
            border-radius: 6px; 
            color: #fff; 
            font-size: 16px; 
            box-sizing: border-box; 
            outline: none; 
            margin-bottom: 20px; 
        }
        .form-control:focus { border-color: var(--gold-primary); }
        select.form-control { cursor: pointer; background: #000; color: #fff; }
        .submit-btn { 
            width: 100%; 
            padding: 14px; 
            background-color: var(--gold-primary); 
            color: #000; 
            border: none; 
            border-radius: 6px; 
            font-size: 16px; 
            font-weight: bold; 
            cursor: pointer; 
            transition: background 0.3s; 
        }
        .submit-btn:hover { background-color: #f3e5ab; }
    </style>
</head>
<body>

    <div id="adminWrapper" style="display:none;">
        <div class="dashboard-card">
            <h1>إضافة ونشر محتوى جديد للأكاديمية 🚀</h1>
            
            <label for="artCategory">اختر الصفحة التي تريد ظهور المقال فيها:</label>
            <select id="artCategory" class="form-control">
                <option value="articles">🏠 الصفحة الرئيسية</option>
                <option value="internet_earning">💰 قسم الربح من الإنترنت</option>
                <option value="facebook_secrets">🔥 قسم أسرار فيسبوك</option>
                <option value="web_development">🌐 قسم بناء وتطوير المواقع</option>
                <option value="sharedArticles">📚 قسم أخبار ونصائح الثانوية العامة</option>
            </select>

            <label for="artTitle">عنوان المقال أو المنشور:</label>
            <input type="text" id="artTitle" class="form-control" placeholder="اكتب العنوان هنا...">

            <label for="artContent">محتوى المقال تفصيلياً:</label>
            <textarea id="artContent" class="form-control" rows="6" placeholder="اكتب نص المقال كاملاً هنا..."></textarea>

            <button id="btnPublish" class="submit-btn">نشر المقال فوراً 📢</button>
        </div>
    </div>

    <script>
        const config = {
            apiKey: "AIzaSyCp-m2DkIIwIoKUeuntHLvDbEclB041pz4",
            authDomain: "shrouk-ehab.firebaseapp.com",
            projectId: "shrouk-ehab",
            storageBucket: "shrouk-ehab.firebasestorage.app",
            messagingSenderId: "1015714183835",
            appId: "1:1015714183835:web:cd71ea6fd14a6a2ef7643e"
        };
        
        firebase.initializeApp(config);
        const db = firebase.firestore();

        // الباسورد الخاص بك
        if(prompt("الباسورد الخاص بالإدارة:") === "123010111  55Ee") {
            document.getElementById('adminWrapper').style.display = 'block';
        } else {
            alert("الباسورد خطأ!");
        }

        // كود النشر المباشر حسب القسم المختار
        document.getElementById("btnPublish").addEventListener("click", () => {
            const title = document.getElementById("artTitle").value.trim();
            const content = document.getElementById("artContent").value.trim();
            const targetCollection = document.getElementById("artCategory").value; // اسم المخزن في الفايربيس

            if(title === "" || content === "") {
                alert("من فضلك املأ العنوان والمحتوى أولاً قبل النشر!");
                return;
            }

            // النشر مباشرة في المخزن الصح اللي اخترته
            db.collection(targetCollection).add({
                title: title,
                content: content,
                category: "الثانوية العامة", // مخصصة فقط لصفحة الثانوية العامة لكي تقرأها بشكل صحيح
                date: new Date().toLocaleDateString('ar-EG', { year: 'numeric', month: 'long', day: 'numeric' })
            })
            .then(() => {
                alert("تم النشر بنجاح والمقال متوفر في صفحتك الآن!");
                document.getElementById("artTitle").value = "";
                document.getElementById("artContent").value = "";
            })
            .catch(err => alert("خطأ أثناء النشر: " + err.message));
        });
    </script>
</body>
</html>
