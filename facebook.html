<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أسرار أرباح فيسبوك - أكاديمية إيموشا</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --gold-primary: #d4af37;
            --gold-hover: #f3e5ab;
            --text-color: #ffffff;
            --text-muted: #b3b3b3;
        }

        body { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; background-color: var(--bg-color); color: var(--text-color); }

        /* الهيدر الذهبي الموحد */
        header { background-color: #000; border-bottom: 2px solid var(--gold-primary); padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 20px; }
        .logo { font-size: 28px; font-weight: bold; color: var(--gold-primary); text-decoration: none; }
        nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; width: 100%; max-width: 1200px; }
        nav a { color: var(--text-color); text-decoration: none; font-weight: bold; font-size: 12px; padding: 12px 10px; background-color: #1a1a1a; border: 1px solid #333; border-radius: 6px; transition: all 0.3s ease; text-align: center; flex: 1; min-width: 130px; }
        nav a:hover { background-color: #252525; border-color: var(--gold-primary); color: var(--gold-primary); }
        nav a.active { background-color: var(--gold-primary); color: #000; border-color: var(--gold-primary); }

        .container { max-width: 800px; margin: 40px auto; padding: 0 20px; text-align: center; }
        h1 { color: var(--gold-primary); border-bottom: 2px solid #333; padding-bottom: 15px; margin-bottom: 30px; }
        
        .article-post { background: var(--card-bg); border-right: 4px solid var(--gold-primary); padding: 20px; margin-bottom: 20px; border-radius: 4px; text-align: right; }
        .article-post h3 a { color: #fff; text-decoration: none; transition: color 0.2s; }
        .article-post h3 a:hover { color: var(--gold-primary); }

        .btn-more { display: inline-block; background-color: var(--gold-primary); color: #000; text-decoration: none; padding: 12px 25px; border-radius: 6px; font-weight: bold; cursor: pointer; border: none; font-size: 14px; margin-top: 20px; }
        .btn-more:hover { background-color: var(--gold-hover); }

        footer { background-color: #000; border-top: 2px solid var(--gold-primary); padding: 30px 20px; margin-top: 60px; text-align: center; }
        .footer-links a { color: var(--text-color); text-decoration: none; margin: 0 15px; }
  
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">أكاديمية إيموشا</a>
        <nav>
            <a href="index.html">الصفحة الرئيسية</a>
            <a href="internet-earning.html">الربح من الإنترنت</a>
            <a href="facebook.html" class="active">أسرار فيسبوك</a>
            <a href="web-dev.html">تطوير المواقع</a>
            <a href="thanwya-books.html">📚 الثانوية العامة</a>
            <a href="thanwya.html">🎓 نتيجة الثانوية العامة</a>
            <a href="azhar.html">🕌 نتيجة الثانوية الأزهرية</a>
        </nav>
    </header>

    <div class="container">
        <h1>قسم أسرار أرباح الفيسبوك والريلز 🎬</h1>
        
        <div id="sectionContainer">
            <p style="color: var(--text-muted);">جاري تحميل المقالات...</p>
        </div>

        <button id="loadMoreFbBtn" class="btn-more" style="display:none;" onclick="loadMoreFbArticles()">عرض المزيد من المقالات ⬇</button>
    </div>
<footer>
    <div class="footer-links">
        <a href="about.html#about">من نحن</a> | 
        <a href="about.html#privacy">سياسة الخصوصية</a> | 
        <a href="about.html#contact">اتصل بنا</a>
    </div>
    <div class="footer-rights">جميع الحقوق محفوظة © 2026 | إدارة القبطان إيهاب شرف</div>
</footer>




   <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBORppTYoq6wbsoM8cED7T_cW5UHVX5XbE",
        authDomain: "emosha-b67a3.firebaseapp.com",
        projectId: "emosha-b67a3",
        storageBucket: "emosha-b67a3.firebasestorage.app",
        messagingSenderId: "136317351287",
        appId: "1:136317351287:web:f9b7186384278ba6c21d72"
    };
    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    const db = firebase.firestore();
    const container = document.getElementById("sectionContainer") || document.body;

    db.collection("articles").where("category", "==", "أسرار فيسبوك").get().then((querySnapshot) => {
        const loadingText = container.querySelector('p') || container;
        if(loadingText && loadingText.innerText.includes("جاري")) { loadingText.remove(); }
        if (querySnapshot.empty) {
            container.innerHTML += "<p style='color:#666; text-align:center; padding: 20px;'>لا توجد مقالات منشورة هنا حالياً.</p>";
            return;
        }
        querySnapshot.forEach((doc) => {
            const data = doc.data();
            container.innerHTML += `
                <div style="background:#1e1e1e; border:1px solid #d4af37; padding:20px; border-radius:8px; margin-bottom:20px; text-align:right; direction:rtl;">
                    <h3 style="color:#d4af37; margin-top:0;">${data.title}</h3>
                    <p style="color:#fff; line-height:1.7; white-space: pre-wrap;">${data.content}</p>
                    <small style="color:#666;">تاريخ النشر: ${data.date || ''}</small>
                </div>`;
        });
    }).catch(err => { container.innerHTML += "<p style='color:red; text-align:center;'>حدث خطأ أثناء تحميل البيانات.</p>"; });
</script>
 
    
</body>
</html>
