        /* التنسيق الأساسي الموحد */
        :root { 
            --bg-color: #121212; 
            --card-bg: #1e1e1e; 
            --gold-primary: #d4af37; 
        }
        body { 
            background-color: var(--bg-color); 
            color: #fff; 
            font-family: sans-serif; 
            margin: 0; 
            display: flex;
            flex-direction: column;
            min-height: 100ve; /* لضمان بقاء الفوتر في الأسفل دائماً */
        }

        /* الهيدر الذهبي الاحترافي الموحد */

            text-decoration: none;

        }
        nav { 
            display: grid;
            grid-template-columns: repeat(2, 1fr); 
            gap: 10px; 
            max-width: 500px;
            margin: 0 auto;
        }
        nav a { 
            color: #fff; 
            text-decoration: none; 
            padding: 12px 10px; 
            border: 1px solid #333; 
            border-radius: 5px; 
            font-size: 13px; 
            text-align: center;
            display: block;
            background: #161616;
        }
        nav a:last-child {
            grid-column: span 2;
        }
        nav a.active { 
            background: var(--gold-primary); 
            color: #000; 
            font-weight: bold; 
            border-color: var(--gold-primary);
        }

        /* المحتوى الرئيسي */
        .container { 
            max-width: 800px; 
            margin: 40px auto; 
            padding: 20px; 
            text-align: right; 
            flex: 1; /* يدفع الفوتر للأسفل لو المحتوى قليل */
        }
        .article-post { 
            background: var(--card-bg); 
            border-right: 5px solid var(--gold-primary); 
            padding: 20px; 
            margin-bottom: 20px;
