<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بناء وتطوير المواقع - أكاديمية إيموشا</title>
    <style>
        :root { 
            --bg-color: #121212; 
            --card-bg: #1e1e1e; 
            --gold-primary: #d4af37; 
        }
        body { 
            background-color: var(--bg-color); 
            color: #fff; 
            font-family: sans-serif; 
            margin: 0; 
            display: flex;
            flex-direction: column;
            min-height: 100vh; /* تعديل الـ typo من ve إلى vh لضمان ثبات الفوتر */
        }

        header { 
            background: #000; 
            border-bottom: 3px solid var(--gold-primary); 
            padding: 20px; 
            text-align: center; 
        }
        .logo { 
            font-size: 28px; 
            font-weight: bold; 
            color: var(--gold-primary); 
            text-decoration: none; 
            display: block; 
            margin-bottom: 15px; 
        }
        nav { 
            display: grid;
            grid-template-columns: repeat(2, 1fr); 
            gap: 10px; 
            max-width: 500px;
            margin: 0 auto;
        }
        nav a { 
            color: #fff; 
            text-decoration: none; 
            padding: 12px 10px; 
            border: 1px solid #333; 
            border-radius: 5px; 
            font-size: 13px; 
            text-align: center;
            display: block;
            background: #161616;
        }
        nav a:last-child {
            grid-column: span 2;
        }
        nav a.active { 
            background: var(--gold-primary); 
            color: #000; 
            font-weight: bold; 
            border-color: var(--gold-primary);
        }

        .container { 
            max-width: 800px; 
            margin: 40px auto; 
            padding: 20px; 
            text-align: right; 
            flex: 1; 
        }
        .article-post { 
            background: var(--card-bg); 
            border-right: 5px solid var(--gold-primary); 
            padding: 20px; 
            margin-bottom: 20px; 
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">أكاديمية إيموشا</a>
        <nav>
            <a href="index.html">الصفحة الرئيسية</a>
            <a href="internet-earning.html">الربح من الإنترنت</a>
            <a href="facebook.html">أسرار فيسبوك</a>
            <a href="web-dev.html" class="active">تطوير المواقع</a>
            <a href="thanwya-books.html">📚 الثانوية العامة</a>
            <a href="thanwya.html">🎓 نتيجة الثانوية العامة</a>
            <a href="azhar.html">🕌 نتيجة الثانوية الأزهرية</a>
        </nav>
    </header>

    <div class="container">
        <h1>قسم بناء وتطوير المواقع 🌐</h1>
        <div id="sectionContainer">جاري التحميل...</div>
    </div>

    <!-- الفوتر الموحد والمعدل للموبايل (تم إزالة الفوتر المكرر القديم وتثبيته هنا) -->
    <footer style="background: #000; border-top: 3px solid var(--gold-primary); padding: 25px 10px; text-align: center; margin-top: auto; font-family: sans-serif;">
        <div class="footer-links" style="margin-bottom: 15px;">
            <a href="about.html#about" style="color: #fff !important; text-decoration: none; margin: 10px auto; font-size: 14px; font-weight: 500; display: block; max-width: fit-content;">من نحن</a>
            <a href="about.html#privacy" style="color: #fff !important; text-decoration: none; margin: 10px auto; font-size: 14px; font-weight: 500; display: block; max-width: fit-content;">سياسة الخصوصية</a>
            <a href="about.html#contact" style="color: #fff !important; text-decoration: none; margin: 10px auto; font-size: 14px; font-weight: 500; display: block; max-width: fit-content;">اتصل بنا</a>
        </div>
        <div class="footer-rights" style="font-size: 12px; color: #666; border-top: 1px solid #111; padding-top: 15px; max-width: 400px; margin: 0 auto;">
            جميع الحقوق محفوظة © 2026 | إدارة القبطان إيهاب شرف
        </div>
    </footer>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBORppTYoq6wbsoM8cED7T_cW5UHVX5XbE",
        authDomain: "emosha-b67a3.firebaseapp.com",
        projectId: "emosha-b67a3",
        storageBucket: "emosha-b67a3.firebasestorage.app",
        messagingSenderId: "136317351287",
        appId: "1:136317351287:web:f9b7186384278ba6c21d72"
    };
    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    const db = firebase.firestore();
    const container = document.getElementById("sectionContainer") || document.body;

    db.collection("articles").where("category", "==", "تطوير المواقع").get().then((querySnapshot) => {
        const loadingText = container.querySelector('p') || container;
        if(loadingText && loadingText.innerText.includes("جاري")) { loadingText.remove(); }
        if (querySnapshot.empty) {
            container.innerHTML += "<p style='color:#666; text-align:center; padding: 20px;'>لا توجد مقالات منشورة في هذا القسم حالياً.</p>";
            return;
        }
        querySnapshot.forEach((doc) => {
            const data = doc.data();
            container.innerHTML += `
                <div style="background:#1e1e1e; border:1px solid #d4af37; padding:20px; border-radius:8px; margin-bottom:20px; text-align:right; direction:rtl;">
                    <h3 style="color:#d4af37; margin-top:0;">${data.title}</h3>
                    <p style="color:#fff; line-height:1.7; white-space: pre-wrap;">${data.content}</p>
                    <small style="color:#666;">تاريخ النشر: ${data.date || ''}</small>
                </div>`;
        });
    }).catch(err => { container.innerHTML += "<p style='color:red; text-align:center;'>حدث خطأ أثناء تحميل المقالات.</p>"; });
</script>

</body>
</html>
